<body style="background-color: black;">
    <button id="orange">Orange</button>
    <button id="green">Green</button>
</body>
<script>
    // Lexical Scope 
    function outer(){
        let name = "Virat kohli"
        function inner(){
            let innerName = "Rohit Sharma"
            // console.log("Too inner function: " , name)
        }
        function innerTwo(){
            // console.log("Too innerTwo function: ",name)
            // console.log("Too innerTwo function: ",innerName)   // it's not access in second inner function
        }
        inner()
        innerTwo()
    }
    outer()

    // Cloures 
    function outerFunc(){
        const name = "Suraj"
        function innerFunc(){
            console.log(name)
        }
        return innerFunc()
    }
    const myfunc = outerFunc()
    // console.log(myfunc)

</script>
<script>
     // +++++++++++++++++++++++++++  Example of closures  ++++++++++++++++++++++++++
          function closureExample(color){

            return function(){            
                document.body.style.backgroundColor = `${color}`
            }
            // closures property return lexical scope and outer function 
          }
          document.getElementById('orange').onclick = closureExample("orange")
          document.getElementById('green').onclick = closureExample("green")
